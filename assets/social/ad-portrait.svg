<?xml version="1.0" encoding="UTF-8"?>
<!-- Boasystemz portrait ad creative — 1080x1350 (Feed / Stories). Dash-free copy. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="0.5" stop-color="#122348"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.65">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="0.7" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#22d3ee" fill-opacity="0.14"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#060c1c" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <circle cx="940" cy="190" r="230" fill="#22d3ee" fill-opacity="0.10"/>
  <circle cx="140" cy="1180" r="220" fill="#06b6d4" fill-opacity="0.10"/>
  <rect width="1080" height="1350" fill="url(#vignette)"/>

  <!-- Logo: mark + wordmark, stacked & centered -->
  <rect x="486" y="160" width="108" height="108" rx="26" fill="url(#mark)" stroke="#ffffff" stroke-opacity="0.12"/>
  <g transform="translate(504,178) scale(3)" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M4 7l8-4 8 4-8 4-8-4z"/>
    <path d="M4 12l8 4 8-4"/>
    <path d="M4 17l8 4 8-4"/>
  </g>
  <text x="540" y="338" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#ffffff">Boa</tspan><tspan fill="#22d3ee">systemz</tspan>
  </text>

  <!-- Headline -->
  <text x="540" y="560" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="100" font-weight="800" letter-spacing="-2.5" fill="#ffffff">Land IT</text>
  <text x="540" y="668" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="100" font-weight="800" letter-spacing="-2.5" fill="#ffffff">Interviews</text>
  <text x="540" y="776" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="100" font-weight="800" letter-spacing="-2.5">
    <tspan fill="#ffffff">&amp; Offers </tspan><tspan fill="#22d3ee">Faster</tspan>
  </text>

  <!-- Subline -->
  <text x="540" y="868" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="500" fill="#aabfe5">Career acceleration for IT professionals</text>

  <!-- Proof line -->
  <text x="540" y="936" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="600" fill="#67e8f9">200+ transformations  ·  senior engineer mentors  ·  offer guarantee</text>

  <!-- CTA pill -->
  <rect x="390" y="1030" width="300" height="96" rx="48" fill="#22d3ee"/>
  <text x="540" y="1091" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="700" fill="#060c1c">Learn More  →</text>

  <!-- URL -->
  <text x="540" y="1240" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="3" fill="#eef3fb">BOASYSTEMZ.COM</text>
</svg>
