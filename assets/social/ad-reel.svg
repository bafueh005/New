<?xml version="1.0" encoding="UTF-8"?>
<!-- Boasystemz Reels/Stories creative — 1080x1920 (9:16). Content kept in the safe zone. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="0.5" stop-color="#122348"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="0.7" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#22d3ee" fill-opacity="0.13"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#060c1c" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#dots)"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>
  <circle cx="930" cy="320" r="260" fill="#22d3ee" fill-opacity="0.10"/>
  <circle cx="150" cy="1640" r="240" fill="#06b6d4" fill-opacity="0.10"/>
  <rect width="1080" height="1920" fill="url(#vignette)"/>

  <!-- Logo: mark + wordmark, stacked & centered -->
  <rect x="486" y="400" width="108" height="108" rx="26" fill="url(#mark)" stroke="#ffffff" stroke-opacity="0.12"/>
  <g transform="translate(504,418) scale(3)" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M4 7l8-4 8 4-8 4-8-4z"/>
    <path d="M4 12l8 4 8-4"/>
    <path d="M4 17l8 4 8-4"/>
  </g>
  <text x="540" y="578" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#ffffff">Boa</tspan><tspan fill="#22d3ee">systemz</tspan>
  </text>

  <!-- Headline -->
  <text x="540" y="800" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-2.5" fill="#ffffff">Land IT</text>
  <text x="540" y="912" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-2.5" fill="#ffffff">Interviews</text>
  <text x="540" y="1024" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-2.5">
    <tspan fill="#ffffff">&amp; Offers </tspan><tspan fill="#22d3ee">Faster</tspan>
  </text>

  <!-- Subline -->
  <text x="540" y="1110" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="500" fill="#aabfe5">Career acceleration for IT professionals</text>

  <!-- Proof line -->
  <text x="540" y="1182" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#67e8f9">200+ transformations  ·  senior engineer mentors</text>

  <!-- CTA pill -->
  <rect x="384" y="1290" width="312" height="100" rx="50" fill="#22d3ee"/>
  <text x="540" y="1355" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="700" fill="#060c1c">Learn More  →</text>

  <!-- URL -->
  <text x="540" y="1500" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="3" fill="#eef3fb">BOASYSTEMZ.COM</text>
</svg>
