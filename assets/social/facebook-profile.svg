<?xml version="1.0" encoding="UTF-8"?>
<!-- Boasystemz profile picture — 512x512. Facebook crops to a circle; the mark sits well inside the inscribed circle. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="0.5" stop-color="#122348"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#22d3ee" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#dots)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Logo mark, centered -->
  <rect x="136" y="136" width="240" height="240" rx="56" fill="url(#mark)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="136" y="136" width="240" height="240" rx="56" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <g transform="translate(184,184) scale(6)" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M4 7l8-4 8 4-8 4-8-4z"/>
    <path d="M4 12l8 4 8-4"/>
    <path d="M4 17l8 4 8-4"/>
  </g>

  <!-- Wordmark below the mark (stays inside the circular crop) -->
  <text x="256" y="438" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#ffffff">Boa</tspan><tspan fill="#22d3ee">systemz</tspan>
  </text>
</svg>
