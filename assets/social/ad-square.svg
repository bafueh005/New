<?xml version="1.0" encoding="UTF-8"?>
<!-- Boasystemz square ad creative — 1080x1080 (Feed / Instagram). Dash-free copy. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="0.5" stop-color="#122348"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="0.7" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#22d3ee" fill-opacity="0.14"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#060c1c" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  <circle cx="930" cy="170" r="220" fill="#22d3ee" fill-opacity="0.10"/>
  <circle cx="150" cy="930" r="200" fill="#06b6d4" fill-opacity="0.10"/>
  <rect width="1080" height="1080" fill="url(#vignette)"/>

  <!-- Logo: mark + wordmark, stacked & centered -->
  <rect x="486" y="108" width="108" height="108" rx="26" fill="url(#mark)" stroke="#ffffff" stroke-opacity="0.12"/>
  <g transform="translate(504,126) scale(3)" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M4 7l8-4 8 4-8 4-8-4z"/>
    <path d="M4 12l8 4 8-4"/>
    <path d="M4 17l8 4 8-4"/>
  </g>
  <text x="540" y="285" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#ffffff">Boa</tspan><tspan fill="#22d3ee">systemz</tspan>
  </text>

  <!-- Headline -->
  <text x="540" y="440" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="#ffffff">Land IT Interviews</text>
  <text x="540" y="540" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2">
    <tspan fill="#ffffff">&amp; Offers </tspan><tspan fill="#22d3ee">Faster</tspan>
  </text>

  <!-- Subline -->
  <text x="540" y="612" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="500" fill="#aabfe5">Career acceleration for IT professionals</text>

  <!-- Proof line -->
  <text x="540" y="676" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600" fill="#67e8f9">200+ transformations  ·  senior engineer mentors  ·  offer guarantee</text>

  <!-- CTA pill -->
  <rect x="396" y="760" width="288" height="92" rx="46" fill="#22d3ee"/>
  <text x="540" y="819" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" fill="#060c1c">Learn More  →</text>

  <!-- URL -->
  <text x="540" y="965" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3" fill="#eef3fb">BOASYSTEMZ.COM</text>
</svg>
